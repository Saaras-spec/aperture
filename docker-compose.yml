services:
  postgres:
    image: postgres:16-alpine
    container_name: aperture_postgres_test
    environment:
      POSTGRES_USER: aperture_user
      POSTGRES_PASSWORD: aperture_password
      POSTGRES_DB: aperture_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aperture_user -d aperture_test"]
      interval: 2s
      timeout: 5s
      retries: 10
