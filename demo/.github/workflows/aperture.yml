name: Aperture Migration Guard

on:
  pull_request:
    paths:
      - "db/migrations/**"
  push:
    branches:
      - main

jobs:
  scan-migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Aperture Migration Scan
        uses: Saaras-spec/aperture@main
        with:
          config: aperture.yml
          base-ref: ${{ github.base_ref || 'origin/main' }}
          fail-on: ERROR
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-pr: "true"
