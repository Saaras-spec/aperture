name: Action Self-Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  self-test:
    name: Run Aperture Action on Fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Test Good Fixtures (Expect Success)
      - name: Prepare good fixtures configuration
        run: |
          cat << 'EOF' > .github/good-config.yml
          fail_on: ERROR
          migration_paths:
            - "tests/fixtures/good/*.sql"
          EOF

      - name: Run action on good fixtures
        id: test_good
        uses: ./
        with:
          config: ".github/good-config.yml"
          fail-on: "ERROR"
          comment-on-pr: "false"

      - name: Verify good fixtures succeeded
        run: |
          if [ "${{ steps.test_good.outcome }}" != "success" ]; then
            echo "Expected good fixtures to succeed, but got: ${{ steps.test_good.outcome }}"
            exit 1
          fi
          echo "Good fixtures passed successfully."

      # 2. Test Bad Fixtures (Expect Failure)
      - name: Prepare bad fixtures configuration
        run: |
          cat << 'EOF' > .github/bad-config.yml
          fail_on: ERROR
          migration_paths:
            - "tests/fixtures/bad/*.sql"
          EOF

      - name: Run action on bad fixtures (expect failure)
        id: test_bad
        uses: ./
        continue-on-error: true
        with:
          config: ".github/bad-config.yml"
          fail-on: "ERROR"
          comment-on-pr: "false"

      - name: Verify bad fixtures failed as expected
        run: |
          if [ "${{ steps.test_bad.outcome }}" != "failure" ]; then
            echo "Expected bad fixtures to fail, but got outcome: ${{ steps.test_bad.outcome }}"
            exit 1
          fi
          echo "Bad fixtures correctly triggered failure (outcome: ${{ steps.test_bad.outcome }})."
