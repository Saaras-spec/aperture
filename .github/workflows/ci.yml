name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Type Check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Lint with ruff
        run: ruff check .

      - name: Check code formatting with ruff
        run: ruff format --check .

      - name: Strict type check with mypy
        run: mypy src tests

      - name: Run unit tests with pytest coverage
        run: pytest --cov=src/aperture --cov-report=term-missing tests/unit

  integration:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aperture_user
          POSTGRES_PASSWORD: aperture_password
          POSTGRES_DB: aperture_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run aperture verify against live PostgreSQL (prints report to CI log)
        env:
          POSTGRES_TEST_URL: postgresql://aperture_user:aperture_password@localhost:5432/aperture_test
        run: |
          aperture verify demo/db/migrations/001_safe.sql --dsn "$POSTGRES_TEST_URL" --i-understand-this-runs-the-migration

      - name: Run integration tests
        env:
          POSTGRES_TEST_URL: postgresql://aperture_user:aperture_password@localhost:5432/aperture_test
        run: pytest -m integration -v tests/integration

  docker:
    name: Docker Build & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t aperture:local .

      - name: Verify CLI entrypoint in container
        run: docker run --rm aperture:local --help
